<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Redirecting...</title>
    <script>
      // GitHub Pages SPA fallback:
      // Convert /some/path?x=1 into /?/some/path&x=1 so index.html can restore it.
      var l = window.location;
      var encodedPath = l.pathname.replace(/^\//, '');
      var encodedSearch = l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '';
      var target = l.protocol + '//' + l.host + '/?/' + encodedPath + encodedSearch + l.hash;
      l.replace(target);
    </script>
  </head>
  <body></body>
</html>
